# Bed tramming with the Eddy. Screw positions from TheFeralEngineer's Neptune 3 Max printer.cfg
# (github.com/TheFeralEngineer/Klipper-for-Elegoo-Neptune-series-3D-Printers). That config lists nozzle
# coordinates for the stock probe (x -28.5, y +22), which put the physical screws at X 37.5 / 392.5 and
# Y 37.5 / 215 / 392.5, plus a centre screw at 215, 215. Converted here to nozzle coordinates for the Eddy
# (x 0, y +27.33), so the coil sits over each screw.
# The centre screw is deliberately left out: the gantry bows about 0.24 mm, and tramming to it would bend
# the bed to follow the bow. Keep it snug; the mesh handles the bow.
# Positions visually confirmed over each screw head, 2026-09-26.
[screws_tilt_adjust]
screw_thread: CW-M3
speed: 150
horizontal_move_z: 3
screw1: 37.5, 10.17
screw1_name: left front (reference)
screw2: 37.5, 187.67
screw2_name: left middle
screw3: 37.5, 365.17
screw3_name: left back
screw4: 392.5, 365.17
screw4_name: right back
screw5: 392.5, 187.67
screw5_name: right middle
screw6: 392.5, 10.17
screw6_name: right front
