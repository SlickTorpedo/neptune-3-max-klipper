# BTT Eddy Duo in CAN mode (its own RP2040 MCU on the bus), driven by eddy-ng
# (https://github.com/vvuk/eddy-ng, installed on the Pi at 1ed056b, 2026-09-25).
# DRAFT: not included from printer.cfg until the Eddy is flashed and on the bus.
# Based on the eddy-ng wiki "BTT Eddy" page. BTT's own eddy.cfg macros must NOT be used alongside it.
# The Eddy firmware must be built from the eddy-ng-patched ~/klipper (it is: ~/fw-out/klipper_eddy.bin).

[mcu eddy]
canbus_uuid: TODO  # from flashtool.py -i can0 -q, recorded in docs/can-bringup.md

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f             # i2c0 on GPIO20/21, no clash with CAN on GPIO4/5
x_offset: 0                # TODO measure: coil centre vs nozzle on the Ben Ford Neptune 3/4 SB plate
y_offset: 0                # TODO measure (BTT's 21.42 is only for a Voron X carriage)
# Drive currents, calibration and tap settings are written by PROBE_EDDY_NG_SETUP + SAVE_CONFIG.

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

# ---------- homing: the Eddy is the Z endstop (user's choice, 2026-09-25) ----------
# When this file goes live, [stepper_z] needs:
#   endstop_pin: probe:z_virtual_endstop   (and drop position_endstop and the stock Z switch on PG11)
# The coil must be over the metal sheet before any Z home, so Z always homes at the bed centre.
[homing_override]
axes: xyz
set_position_z: 0          # lets Z move up before it's homed (only needed when Z isn't homed)
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% if 'z' not in printer.toolhead.homed_axes %}
    G91
    G0 Z5 F600             # lift clear before XY moves
    G90
  {% endif %}
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}
  {% if home_all or 'Z' in params %}
    {% set xo = printer.configfile.settings['probe_eddy_ng btt_eddy'].x_offset %}
    {% set yo = printer.configfile.settings['probe_eddy_ng btt_eddy'].y_offset %}
    G90
    G0 X{210 - xo} Y{210 - yo} F6000   # coil over bed centre
    G28 Z                  # coarse eddy home
    G0 Z2 F1000            # eddy-ng's most accurate height
    G4 P1000
    M400
    PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
    G0 Z5 F1000
  {% endif %}

# bed_mesh and z_tilt get written once the offsets are known. bed_mesh must use horizontal_move_z: 2.0.
# PRINT_START order (eddy-ng wiki "Macros"): home, heat soak, Z_TILT_ADJUST, clean nozzle at 150C,
# PROBE_EDDY_NG_TAP, heat to print temp, BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan, print.
# PRINT_END: PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0 and BED_MESH_CLEAR.
