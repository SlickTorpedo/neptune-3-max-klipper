# BTT Eddy Duo in CAN mode: its own RP2040 MCU on the bus (not an I2C coil behind the SB2209).
# DRAFT: not included from printer.cfg until the Eddy is flashed and on the bus.
# Based on BTT sample-bigtreetech-eddy.cfg (bigtreetech/Eddy). The Eddy USB firmware and the Duo
# are the same RP2040 design, so the I2C bus and thermistor pin carry over. Only the transport
# changes from USB serial to canbus_uuid.

[mcu eddy]
canbus_uuid: TODO  # from flashtool.py -i can0 -q, recorded in docs/can-bringup.md

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.5
i2c_mcu: eddy
i2c_bus: i2c0f             # i2c0 on GPIO20/21, no clash with CAN on GPIO4/5
x_offset: 0                # TODO measure: coil centre vs nozzle on the Ben Ford Neptune 3/4 SB plate
y_offset: 0                # TODO measure (BTT's 21.42 is only for a Voron X carriage)

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# Homing: the user chose the Eddy as the Z endstop (2026-09-25). When this file goes live:
#   [stepper_z] endstop_pin: probe:z_virtual_endstop  (drop position_endstop and the stock Z switch on PG11)
#   [safe_z_home] at the bed centre (210, 210, adjusted for the probe offset), z_hop 10
#   BTT's G28 / SET_Z_FROM_PROBE / SET_GCODE_OFFSET macros from sample-bigtreetech-eddy-homing.cfg
# bed_mesh and z_tilt get written once the offsets are known.
