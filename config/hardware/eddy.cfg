# BTT Eddy Duo in CAN mode (its own RP2040 MCU on the bus), driven by eddy-ng
# (https://github.com/vvuk/eddy-ng, installed on the Pi at 1ed056b, 2026-09-25).
# Homing with the Eddy lives in eddy_homing.cfg, which is only included after PROBE_EDDY_NG_SETUP.
# Based on the eddy-ng wiki "BTT Eddy" page. BTT's own eddy.cfg macros must NOT be used alongside it.
# The Eddy firmware must be built from the eddy-ng-patched ~/klipper (it is: ~/fw-out/klipper_eddy.bin).

[mcu eddy]
canbus_uuid: 6e4e53261cb4

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f             # i2c0 on GPIO20/21, no clash with CAN on GPIO4/5
x_offset: 0                # PLACEHOLDER: measure the coil centre vs the nozzle before calibration or homing
y_offset: 20               # PLACEHOLDER: eddy-ng refuses 0,0; not used by anything until calibration
# Drive currents, calibration and tap settings are written by PROBE_EDDY_NG_SETUP + SAVE_CONFIG.

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

# bed_mesh and z_tilt get written once the offsets are known. bed_mesh must use horizontal_move_z: 2.0.
# PRINT_START order (eddy-ng wiki "Macros"): home, heat soak, Z_TILT_ADJUST, clean nozzle at 150C,
# PROBE_EDDY_NG_TAP, heat to print temp, BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan, print.
# PRINT_END: PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0 and BED_MESH_CLEAR.
