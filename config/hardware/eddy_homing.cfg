# Eddy as Z endstop (eddy-ng). stepper_z uses probe:z_virtual_endstop.
# G28 Z only works after PROBE_EDDY_NG_SETUP has been run and saved.

# ---------- homing: the Eddy is the Z endstop (user's choice, 2026-09-25) ----------
# When this file goes live, [stepper_z] needs:
#   endstop_pin: probe:z_virtual_endstop   (and drop position_endstop and the stock Z switch on PG11)
# The coil must be over the metal sheet before any Z home, so Z always homes at the bed centre.
[homing_override]
axes: xyz
set_position_z: 0          # lets Z move up before it's homed (only needed when Z isn't homed)
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% if 'z' not in printer.toolhead.homed_axes %}
    G91
    G0 Z5 F600             # lift clear before XY moves
    G90
  {% endif %}
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}
  {% if home_all or 'Z' in params %}
    {% set xo = printer.configfile.settings['probe_eddy_ng btt_eddy'].x_offset %}
    {% set yo = printer.configfile.settings['probe_eddy_ng btt_eddy'].y_offset %}
    G90
    G0 X{210 - xo} Y{210 - yo} F6000   # coil over bed centre
    G28 Z                  # coarse eddy home
    G0 Z2 F1000            # eddy-ng's most accurate height
    G4 P1000
    M400
    PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
    G0 Z5 F1000
  {% endif %}
