# Bed mesh for the 420 x 420 bed, scanned by the Eddy (eddy-ng).
# mesh_min/mesh_max follow BTT's formula for the measured offsets in eddy.cfg (x 0, y +27.33):
#   min = 0   + max(15, offset if positive)      max = 420 - max(15, |offset| if negative)
[bed_mesh]
horizontal_move_z: 2.0     # eddy-ng's most accurate scan height (bed trammed flat 2026-09-27; min clearance ~1.3 mm)
speed: 150
mesh_min: 15, 28
mesh_max: 405, 405
probe_count: 15, 15        # 21x21 stalled the Pi 3 host (Timer too close); 28 mm spacing is plenty
algorithm: bicubic
