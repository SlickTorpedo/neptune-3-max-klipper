# Bed mesh for the 420 x 420 bed, scanned by the Eddy (eddy-ng).
# PROVISIONAL: mesh_min/mesh_max follow BTT's formula for the PLACEHOLDER offsets in eddy.cfg
# (x 0, y +20). Recompute when the real offsets are measured:
#   min = 0   + max(15, offset if positive)      max = 420 - max(15, |offset| if negative)
[bed_mesh]
horizontal_move_z: 2.0     # eddy-ng's most accurate scan height
speed: 150
mesh_min: 15, 20
mesh_max: 405, 405
probe_count: 21, 21
algorithm: bicubic
