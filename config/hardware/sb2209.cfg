# BTT EBB SB2209 CAN v1.0 (STM32G0B1) toolhead.
# DRAFT: not included from printer.cfg until the board is on the bus.
# Pins: BTT sample-bigtreetech-ebb-sb-canbus-v1.0.cfg, cross-checked against the
# BIGTREETECH EBB SB2209 CAN V1.0 schematic (PA0 = TIM2_CH1 = FAN1, PA1 = TIM2_CH2 = FAN2).
# Anything marked TODO still needs checking on the real toolhead.

[mcu sb2209]
canbus_uuid: TODO  # from flashtool.py -i can0 -q, recorded in docs/can-bringup.md

# ---------- extruder: CW2 (Filamatrix) + X1C hotend ----------
[extruder]
step_pin: sb2209:PD0
dir_pin: !sb2209:PD1        # TODO confirm direction with a cold extrude test
enable_pin: !sb2209:PD2
microsteps: 16
rotation_distance: 22.6789511  # Voron CW2 default, then calibrate
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: sb2209:PB13
sensor_type: Generic 3950   # fallback: ATC Semitec 104GT-2 if readings look off
sensor_pin: sb2209:PA3      # TH0; the 2.2K/PT1000 jumper must be OFF
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 150
pressure_advance: 0.04
control: pid                # placeholder, run PID_CALIBRATE before printing
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982

[tmc2209 extruder]
uart_pin: sb2209:PA15
run_current: 0.5            # TODO set from the CW2 motor's rating
stealthchop_threshold: 0

# ---------- fans (V_FAN1/V_FAN2 jumpers on VIN = 24 V) ----------
# Per the user (2026-09-25): bottom fan (hotend) on FAN1, top fan (part cooling) on FAN2.
[fan]
pin: sb2209:PA1             # FAN2: part cooling (top)

[heater_fan hotend_fan]
pin: sb2209:PA0             # FAN1: hotend fan (bottom)
heater: extruder
heater_temp: 50.0

# ---------- Stealthburner LEDs ----------
[neopixel sb_leds]
pin: sb2209:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.3

# ---------- accelerometer ----------
[adxl345]
cs_pin: sb2209:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: z,-y,x            # BTT sample for a Stealthburner; TODO confirm with ACCELEROMETER_QUERY

[resonance_tester]
accel_chip: adxl345
probe_points: 210, 210, 20

# ---------- board temperature ----------
[temperature_sensor sb2209]
sensor_type: Generic 3950
sensor_pin: sb2209:PA2

# ---------- Filamatrix filament sensor ----------
# Single switch on the SB2209's 3-pin endstop port (P10, "Stop1" = Endstop1 = PB6 per schematic).
# Pulls to GND with no filament and floats with filament loaded, so with a pull-up it reads
# high = filament present, which is what filament_switch_sensor expects (no inversion).
# TODO confirm the pin with QUERY_FILAMENT_SENSOR SENSOR=filamatrix, loaded vs. empty.
[filament_switch_sensor filamatrix]
switch_pin: ^sb2209:PB6
pause_on_runout: True
