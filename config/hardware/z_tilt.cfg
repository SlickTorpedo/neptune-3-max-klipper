# Two independent Z motors (stepper_z = left, stepper_z1 = right).
# Lead screws measured 2026-09-26: about 25 mm outside each bed edge.
# Everything below is in nozzle coordinates (Klipper z_tilt docs). The probe points put the Eddy coil
# (y_offset +27.33) at X30/X390, Y210.
[z_tilt]
z_positions:
    -25, 210
    445, 210
points:
    30, 182.67
    390, 182.67
speed: 150
horizontal_move_z: 3       # eddy-ng reads without a Z move; 1-3 mm is its most accurate band
retries: 5
retry_tolerance: 0.02
