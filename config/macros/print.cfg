# PRINT_START / PRINT_END for the Neptune 3 Max (eddy-ng + KAMP). Called from OrcaSlicer:
#   start: PRINT_START BED=[bed_temperature_initial_layer_single] HOTEND=[nozzle_temperature_initial_layer]
#   end:   PRINT_END
# Order follows the eddy-ng wiki "Macros" page: home, heat soak, Z_TILT, nozzle at 150 C, TAP, then mesh.
# No nozzle brush yet (2026-09-27), so there's no wipe before the tap: glance at the nozzle for a blob first.

[gcode_macro PRINT_START]
description: Heat, home, level, tap, adaptive mesh, purge
gcode:
  {% set BED = params.BED|default(60)|float %}
  {% set HOTEND = params.HOTEND|default(215)|float %}
  {% set TAP_TEMP = 150 %}                       # warm enough to soften residue, too cool to ooze PLA
  {% set cx = printer.toolhead.axis_maximum.x / 2 %}
  {% set cy = printer.toolhead.axis_maximum.y / 2 %}

  CLEAR_PAUSE
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0
  PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0

  M140 S{BED}
  M104 S{TAP_TEMP}
  G90
  M83
  G28
  M190 S{BED}

  Z_TILT_ADJUST
  G28 Z

  M109 S{TAP_TEMP}
  G1 X{cx} Y{cy} Z5 F6000
  PROBE_EDDY_NG_TAP                              # sets true Z=0 and the tap offset used by the mesh

  BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan

  SMART_PARK                                     # KAMP: wait near the print area
  M109 S{HOTEND}
  LINE_PURGE                                     # KAMP: short purge line in front of the print

[gcode_macro PRINT_END]
description: Retract, lift, present the bed, turn everything off
gcode:
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set max_y = printer.toolhead.axis_maximum.y %}
  {% set z_safe = [printer.toolhead.position.z + 10, max_z]|min %}
  M400
  M83
  G1 E-1 F2100                                   # matches KAMP tip_distance
  G90
  G1 Z{z_safe} F600
  G1 X{printer.toolhead.axis_maximum.x / 2} Y{max_y - 10} F6000   # nozzle to the back = bed out front
  M400
  TURN_OFF_HEATERS
  M107
  BED_MESH_CLEAR
  PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
  M84
