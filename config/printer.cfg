[include hardware/sb2209.cfg]
[include hardware/eddy.cfg]
[include hardware/bed_mesh.cfg]
[include hardware/eddy_homing.cfg]
[include hardware/z_tilt.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_330034000951343437373238-if00

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100

[force_move]
enable_force_move: True

# ---------- MOTOR0: X ----------
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG6
position_endstop: 0
position_max: 420
homing_speed: 30

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.800
stealthchop_threshold: 999999

# ---------- MOTOR1: Y ----------
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9
position_endstop: 0
position_max: 420
homing_speed: 30

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.800
stealthchop_threshold: 999999

# ---------- MOTOR3: Z right (verified 2026-09-26) ----------
[stepper_z]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop   # Eddy (eddy-ng); stock Z switch on PG11 retired 2026-09-26
position_min: -2                       # eddy-ng tap presses slightly below Z=0
position_max: 500
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC7
run_current: 0.600
stealthchop_threshold: 999999

# ---------- MOTOR4: Z left (verified 2026-09-26) ----------
[stepper_z1]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PF2
run_current: 0.600
stealthchop_threshold: 999999

# ---------- sensors ----------
# Bed: Octopus HE0 (PA2) drives an external MOSFET module that switches the bed (user, 2026-09-26).
# HE0 = PA2 per klipper/config/generic-bigtreetech-octopus-v1.1.cfg. Thermistor on TB (PF3).
[heater_bed]
heater_pin: PA2
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 110
control: pid                # placeholder until PID_CALIBRATE HEATER=heater_bed
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

# Stock Elegoo runout sensor: still wired, but not mounted yet (2026-09-26).
# Keep pause_on_runout off and don't reference it from any macro.
[filament_switch_sensor filament]
switch_pin: ^PG10
pause_on_runout: False

# ---------- fans / light ----------
[led caselight]
white_pin: PA8
initial_white: 1.0

[fan_generic case_fan]
pin: PE5

[fan_generic hotend_fan]
pin: PD12

# ---------- misc ----------
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]
[respond]

