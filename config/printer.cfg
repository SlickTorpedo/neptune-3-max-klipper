[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_330034000951343437373238-if00

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100

[force_move]
enable_force_move: True

# ---------- MOTOR0: X ----------
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG6
position_endstop: 0
position_max: 420
homing_speed: 30

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.800
stealthchop_threshold: 999999

# ---------- MOTOR1: Y ----------
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9
position_endstop: 0
position_max: 420
homing_speed: 30

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.800
stealthchop_threshold: 999999

# ---------- MOTOR3: Z left ----------
[stepper_z]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PG11
position_endstop: 0
position_max: 500

[tmc2209 stepper_z]
uart_pin: PC7
run_current: 0.600
stealthchop_threshold: 999999

# ---------- MOTOR4: Z right ----------
[stepper_z1]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PF2
run_current: 0.600
stealthchop_threshold: 999999

# ---------- sensors ----------
[temperature_sensor bed]
sensor_type: Generic 3950
sensor_pin: PF3

[temperature_sensor hotend]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4

[filament_switch_sensor filament]
switch_pin: ^PG10
pause_on_runout: False

# ---------- fans / light ----------
[led caselight]
white_pin: PA8
initial_white: 1.0

[fan_generic case_fan]
pin: PE5

[fan_generic hotend_fan]
pin: PD12

# ---------- misc ----------
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]
[respond]
